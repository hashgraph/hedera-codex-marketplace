name: "Validate Marketplace"
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

defaults:
  run:
    shell: bash

# Plugin PRs come from forks, so this uses pull_request (not pull_request_target) and no secrets.
permissions:
  contents: read

concurrency:
  group: validate-marketplace-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate marketplace
    runs-on: hg-hxm-lin-md
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Test the validator
        run: node --test scripts/*.test.mjs

      - name: Validate manifest, plugins and pinned commits
        run: node scripts/validate-marketplace.mjs . --check-remote
